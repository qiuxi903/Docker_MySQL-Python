# 可选：真实 IP 反代 —— 学生经 nginx 访问时，容器能拿到真实来源 IP（自动写进 X-Forwarded-For）。
# 启用：docker compose --profile realip up -d
#   反代占用 PROXY_PORT（默认 80），与 web 的 WEB_PORT 各占各的端口，不会冲突；
#   学生改从 PROXY_PORT 访问即可看到真实 IP（管理后台「总览 → 网络诊断」可验证）。
#   （服务器上已有宝塔/nginx 在前面做反代的话，不用开这个：给它的反代配��加上
#    X-Forwarded-For / X-Real-IP 两个头，并保持 .env 的 TRUST_PROXY=1 即可）
services:
  db:
    image: ${MYSQL_IMAGE:-mysql:5.7}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: meta
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=400
      - --skip-local-infile
      - --lower-case-table-names=1
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [lab]

  runner:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    command: ["uvicorn", "runner.server:app", "--host", "0.0.0.0", "--port", "8100"]
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-change-me-runner-token}
    # ---- 沙箱加固：不对外、只读根目录、限资源 ----
    pids_limit: 96
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [lab]

  # 可选：真实 IP 反代 —— 学生经 nginx 访问时，容器能拿到真实来源 IP（自动写进 X-Forwarded-For）。
  # 用法：docker compose --profile realip up -d，学生访问 http://服务器:PROXY_PORT
  # 端口：PROXY_PORT 默认 80；宿主机 80 被宝塔等占用时在 .env 里改成别的（如 8080）
  proxy:
    image: nginx:alpine
    container_name: mysqlpython-proxy
    restart: unless-stopped
    profiles: ["realip"]   # 默认不启动；docker compose --profile realip up -d 时才起
    depends_on: [web]
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [lab, edge]

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RUNNER_URL: http://runner:8100
      RUNNER_TOKEN: ${RUNNER_TOKEN:-change-me-runner-token}
      GUEST_TTL_DAYS: "7"
      SQL_TIMEOUT_SEC: "10"
      ROWS_LIMIT: "500"
      # 反代头信任策略：1=信任（宝塔/Nginx 反代后面用，管理后台显示学生真实 IP）
      # 0=只认直连来源（防伪造）；不设=auto（有反代头就用，兼容旧行为）
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started
    networks: [lab, edge]

networks:
  lab:
    internal: true   # 内部网络：db/runner 无外网出口
  edge:

volumes:
  dbdata:
